<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и регистрация — Горецкая ДЮСШ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-shell {
            width: 100%;
            max-width: 960px;
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.25);
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 620px;
        }
        .auth-brand {
            background: linear-gradient(160deg, #1d4ed8, #1e40af);
            color: #fff;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .auth-brand h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .auth-brand p {
            opacity: 0.92;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .auth-brand ul {
            list-style: none;
            display: grid;
            gap: 1rem;
        }
        .auth-brand li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
        }
        .auth-brand li i {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-panel {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: #f1f5f9;
            padding: 0.35rem;
            border-radius: 12px;
        }
        .auth-tab {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            color: #64748b;
        }
        .auth-tab.active {
            background: #fff;
            color: #1d4ed8;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .field { margin-bottom: 1rem; }
        .field label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.35rem;
        }
        .field input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font: inherit;
        }
        .field input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .auth-submit {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.9rem 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .auth-submit:disabled { opacity: 0.65; cursor: not-allowed; }
        .auth-status {
            margin-top: 1rem;
            font-size: 0.875rem;
            min-height: 1.25rem;
        }
        .auth-status.error { color: #dc2626; }
        .auth-status.success { color: #059669; }
        .auth-limit {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #eff6ff;
            border-radius: 10px;
            font-size: 0.8125rem;
            color: #1e40af;
        }
        @media (max-width: 860px) {
            .auth-shell { grid-template-columns: 1fr; }
            .auth-brand { padding: 2rem; }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-brand">
            <h1><i class="fas fa-hockey-sticks"></i> Горецкая ДЮСШ</h1>
            <p>Войдите или зарегистрируйтесь, чтобы пользоваться онлайн-бронированием объектов спортивной школы.</p>
            <ul>
                <li><i class="fas fa-calendar-check"></i> Бронирование ледовой арены, залов и стадиона</li>
                <li><i class="fas fa-clock"></i> Проверка свободных слотов в реальном времени</li>
                <li><i class="fas fa-users"></i> До 200 зарегистрированных пользователей</li>
            </ul>
        </div>
        <div class="auth-panel">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Вход</button>
                <button type="button" class="auth-tab" data-tab="register">Регистрация</button>
            </div>

            <form id="loginForm" class="auth-form active" novalidate>
                <div class="field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="auth-submit">Войти</button>
                <p class="auth-status" id="loginStatus" role="status"></p>
            </form>

            <form id="registerForm" class="auth-form" novalidate>
                <div class="field">
                    <label for="regFullName">ФИО</label>
                    <input type="text" id="regFullName" required maxlength="100" autocomplete="name">
                </div>
                <div class="field">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="regPhone">Телефон</label>
                    <input type="tel" id="regPhone" required maxlength="40" autocomplete="tel">
                </div>
                <div class="field">
                    <label for="regPassword">Пароль</label>
                    <input type="password" id="regPassword" required minlength="6" autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="regPasswordConfirm">Подтверждение пароля</label>
                    <input type="password" id="regPasswordConfirm" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="auth-submit">Зарегистрироваться</button>
                <p class="auth-status" id="registerStatus" role="status"></p>
            </form>
        </div>
    </div>

    <script>
        const isHttp = location.protocol === 'http:' || location.protocol === 'https:';

        async function checkAlreadyLoggedIn() {
            if (!isHttp) return;
            try {
                const res = await fetch('api/auth.php?action=me', { credentials: 'same-origin' });
                const data = await res.json();
                if (data.authenticated) {
                    window.location.href = 'index.html';
                }
            } catch (e) {}
        }

        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
            });
        });

        function setStatus(el, text, type) {
            el.textContent = text;
            el.className = 'auth-status' + (type ? ' ' + type : '');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('loginStatus');
            setStatus(status, '');
            if (!isHttp) {
                setStatus(status, 'Запустите сайт через локальный сервер (PHP).', 'error');
                return;
            }
            const btn = e.target.querySelector('.auth-submit');
            btn.disabled = true;
            try {
                const res = await fetch('api/auth.php?action=login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value.trim(),
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    setStatus(status, data.message, 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 400);
                } else {
                    setStatus(status, data.message || 'Ошибка входа', 'error');
                }
            } catch (err) {
                setStatus(status, 'Ошибка сети', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('registerStatus');
            setStatus(status, '');
            if (!isHttp) {
                setStatus(status, 'Запустите сайт через локальный сервер (PHP).', 'error');
                return;
            }
            const btn = e.target.querySelector('.auth-submit');
            btn.disabled = true;
            try {
                const res = await fetch('api/auth.php?action=register', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: document.getElementById('regFullName').value.trim(),
                        email: document.getElementById('regEmail').value.trim(),
                        phone: document.getElementById('regPhone').value.trim(),
                        password: document.getElementById('regPassword').value,
                        password_confirm: document.getElementById('regPasswordConfirm').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    setStatus(status, data.message, 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 400);
                } else {
                    setStatus(status, data.message || 'Ошибка регистрации', 'error');
                }
            } catch (err) {
                setStatus(status, 'Ошибка сети', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        checkAlreadyLoggedIn();
    </script>
</body>
</html>
